name: AXIOM Windows Setup

on:
  workflow_dispatch:

jobs:
  windows-build:
    name: Build AXIOM Windows x64
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install desktop dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build AXIOM Windows Setup
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Show release files
        shell: powershell
        run: |
          Get-ChildItem release -Recurse |
            Select-Object FullName, Length

      - name: Upload AXIOM installer
        uses: actions/upload-artifact@v4
        with:
          name: AXIOM-Windows-Setup-1.0.0
          path: |
            release/AXIOM-Setup-1.0.0.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 30
